apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-kapt'

def static buildTime() {
    return new Date().format("yyyyMMdd_HHmm", TimeZone.getTimeZone("GMT+08:00"))
}

def appVersionCode = 20
def appVersionName = "1.0.20"
def releaseStoreFilePath = (findProperty("YIWANTV_RELEASE_STORE_FILE") ?: System.getenv("YIWANTV_RELEASE_STORE_FILE")) as String
def releaseStorePassword = (findProperty("YIWANTV_RELEASE_STORE_PASSWORD") ?: System.getenv("YIWANTV_RELEASE_STORE_PASSWORD")) as String
def releaseKeyAlias = (findProperty("YIWANTV_RELEASE_KEY_ALIAS") ?: System.getenv("YIWANTV_RELEASE_KEY_ALIAS")) as String
def releaseKeyPassword = (findProperty("YIWANTV_RELEASE_KEY_PASSWORD") ?: System.getenv("YIWANTV_RELEASE_KEY_PASSWORD")) as String
def hasReleaseSigning = releaseStoreFilePath &&
        releaseStorePassword &&
        releaseKeyAlias &&
        releaseKeyPassword &&
        file(releaseStoreFilePath).exists()

android {
    namespace 'com.github.tvbox.osc'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yiwan.tv'
        targetSdkVersion 34
        versionCode appVersionCode
        versionName appVersionName
        multiDexEnabled true
        //设置room的Schema的位置
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        // 原为 exclude 'lib/**/*.so'，把全部 native 库剥离，但 IJK 播放器选项
        // 与 QuickJS 爬虫引擎的调用路径仍留在代码和设置里，选中即 UnsatisfiedLinkError。
        // 现按用途分别处理（阿里云播放器依赖已整体移除）：
        //   保留 QuickJS（约 1.2MB）—— .js 爬虫源依赖它，否则用户自填的 js 源静默失效
        //   排除 IJK / P2P / 迅雷（合计约 24MB）—— 对应播放器选项已从设置页移除
        exclude 'lib/**/libijk*.so'
        exclude 'lib/**/libp2p.so'
        exclude 'lib/**/libxl_*.so'
    }

    signingConfigs {
        releaseKey {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing false
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.releaseKey
            }
        }
    }

    // 未配置签名时，release 过去会静默产出未签名 APK——用临时签名补签会导致
    // 已分发用户无法覆盖升级。改为构建失败，确需未签名产物时显式加 -PallowUnsigned。
    gradle.taskGraph.whenReady { graph ->
        boolean buildingRelease = graph.allTasks.any { task ->
            task.project == project && task.name.startsWith("assemble") && task.name.endsWith("Release")
        }
        if (buildingRelease && !hasReleaseSigning && !project.hasProperty("allowUnsigned")) {
            throw new GradleException(
                    "release 构建缺少签名配置，拒绝产出未签名 APK。\n" +
                    "请在 ~/.gradle/gradle.properties 或环境变量中提供：\n" +
                    "  YIWANTV_RELEASE_STORE_FILE / YIWANTV_RELEASE_STORE_PASSWORD /\n" +
                    "  YIWANTV_RELEASE_KEY_ALIAS / YIWANTV_RELEASE_KEY_PASSWORD\n" +
                    "详见 docs/SIGNING.md。确需未签名产物时加 -PallowUnsigned。")
        }
    }

    flavorDimensions += ["abi", "brand", "mode"]
    productFlavors {
        armeabi {
            dimension = "abi"
            ndk {
                abiFilters 'armeabi-v7a'
            }
        }
        arm64 {
            dimension = "abi"
            ndk {
                abiFilters 'arm64-v8a'
            }
        }

        generic  {
            //通用版本
            dimension = "brand"
        }

        hisense {
            //海信的
            applicationId 'com.github.hisense.osc.tk'
            dimension = "brand"
        }
        normal {
            dimension = "mode"
            minSdkVersion 21
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        python {
            dimension = "mode"
            minSdkVersion 21
            // Python 版本需要额外的 Proguard 规则
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-python.pro'
        }
    }
    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def abiFlavor = variant.productFlavors.find { it.dimension == "abi" }?.name
            def brandFlavor = variant.productFlavors.find { it.dimension == "brand" }?.name
            def modeFlavor = variant.productFlavors.find { it.dimension == "mode" }?.name
            def abiName = abiFlavor == "arm64" ? "arm64-v8a" : (abiFlavor == "armeabi" ? "armeabi-v7a" : abiFlavor)
            def flavorNames = variant.productFlavors.collect { it.name == "normal" ? "java" : it.name }.join('-')
            // 只有真正配置了签名才叫 signed，否则文件名会把未签名包伪装成可发布产物
            def signedSuffix = hasReleaseSigning ? "signed" : "unsigned"
            def fileName = "SummerTV-v${appVersionName}-${variant.buildType.name}-${flavorNames}.apk"
            if (variant.buildType.name == "release" && brandFlavor == "generic" && modeFlavor == "normal") {
                fileName = "SummerTV-v${appVersionName}-release-${abiName}-${signedSuffix}.apk"
            }
            outputFileName = fileName
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    buildFeatures {
        dataBinding = true
    }

    lint {
        disable 'UnsafeOptInUsageError'
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }
    api fileTree(dir: "libs", include: ['*.jar', '*.aar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    // for WebDAV
    implementation('com.github.thegrizzlylabs:sardine-android:0.8') {
        exclude group: 'com.squareup.okhttp3'
    }
    implementation 'com.github.NanoHttpd.nanohttpd:nanohttpd:nanohttpd-project-2.3.1'
    implementation 'com.github.NanoHttpd.nanohttpd:nanohttpd:nanohttpd-websocket-2.3.1'
    implementation 'com.google.zxing:core:3.5.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation project(path: ':quickjs')
    pythonImplementation project(":pyramid")
    
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'com.github.alidili:FlowLayout:v1.5'
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.squareup.okhttp3:okhttp:3.12.11'
    implementation 'com.squareup.okio:okio:3.3.0'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.49-androidx'
    implementation 'com.kingja.loadsir:loadsir:1.3.8'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'me.jessyan:autosize:1.2.1'
    implementation('com.thoughtworks.xstream:xstream:1.4.20') {
        exclude group: 'xmlpull', module: 'xmlpull'
    }
    implementation 'org.greenrobot:eventbus:3.3.1'
    implementation 'com.orhanobut:hawk:2.0.1'
    implementation 'net.sourceforge.streamsupport:android-retrofuture:1.7.4'
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation "androidx.media3:media3-exoplayer:1.3.1"
    implementation "androidx.media3:media3-ui:1.3.1"
    implementation "androidx.media3:media3-exoplayer-dash:1.3.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.3.1"
    implementation "androidx.media3:media3-exoplayer-rtsp:1.3.1"
    implementation "androidx.media3:media3-datasource-rtmp:1.3.1"
    implementation 'androidx.media3:media3-common:1.3.1'
    implementation "com.github.anilbeesetti.nextlib:nextlib-media3ext:0.7.1"

    // 阿里云播放器已移除：native 库未打包、设置项已删，编译依赖一并去除（xyz.doikki.videoplayer.aliplayer 同步删除）
    implementation 'xyz.doikki.android.dkplayer:dkplayer-ui:3.3.7'
    implementation 'xyz.doikki.android.dkplayer:videocache:3.3.7'

    implementation 'com.lzy.net:okgo:3.0.4'
    implementation 'com.owen:tv-recyclerview:3.0.0'
    implementation 'com.blankj:utilcodex:1.31.0'
    implementation 'com.github.getActivity:XXPermissions:18.5'
    implementation 'org.jsoup:jsoup:1.16.1'
    implementation 'com.github.hedzr:android-file-chooser:v1.2.0-final'
    implementation 'commons-io:commons-io:2.13.0'
    implementation 'com.googlecode.juniversalchardet:juniversalchardet:1.0.3'
//    implementation files('libs/thunder.jar')
    implementation 'org.apache.commons:commons-text:1.10.0'
    implementation 'com.github.seven332:jcifs:1.3.19'
    implementation 'org.conscrypt:conscrypt-android:2.5.2'
    implementation 'io.github.inflationx:viewpump:2.1.1'
    implementation 'io.github.inflationx:calligraphy3:3.1.1'
    implementation 'com.github.ctiao:DanmakuFlameMaster:0.9.25'
    implementation('org.simpleframework:simple-xml:2.7.1') {
        exclude group: 'stax', module: 'stax-api'
        exclude group: 'xpp3', module: 'xpp3'
    }
    configurations {
        configureEach {
            exclude group: 'xpp3', module: 'xpp3'
        }
    }
}
